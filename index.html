<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidad Privada de Trujillo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: white;
            text-align: center;
            padding: 25px;
            border-bottom: 5px solid #a6193c;
        }

        .logo {
            width: 350px;
            max-width: 90%;
            height: auto;
            margin-bottom: 15px;
        }

        header h1 {
            color: #a6193c;
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            color: #555;
            font-size: 17px;
        }

        .contenedor {
            max-width: 850px;
            margin: 35px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h2 {
            color: #a6193c;
            border-bottom: 2px solid #a6193c;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .integrantes {
            background-color: #f9f0f3;
            padding: 20px 35px;
            border-left: 5px solid #a6193c;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .integrantes ul {
            line-height: 2;
        }

        .tareas {
            margin-top: 20px;
        }

        .tarea {
            background-color: #a6193c;
            color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .tarea a {
            background-color: white;
            color: #a6193c;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .tarea a:hover {
            background-color: #eeeeee;
        }

        footer {
            background-color: #a6193c;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .tarea {
                flex-direction: column;
                text-align: center;
            }

            header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="logo-uprit.png" alt="Logo Universidad Privada de Trujillo" class="logo">
        <h1>UNIVERSIDAD PRIVADA DE TRUJILLO</h1>
        <p>CURSO: PENSAMIENTO, LENGUAJE Y COGNICIÓN VISUAL</p>
    </header>

    <div class="contenedor">

        <h2>ALUMNO</h2>

        <div class="integrante">
            <ul type="circle">
                <li>YIYE AARON CURI ALCANTARA</li>
            </ul>
        </div>

        <h2>TAREAS A REVISAR</h2>

        <div class="tareas">

            <div class="tarea">
                <span>TAREA N° 1 - CURRICULO</span>
                <a href="caso1_formularioGRUPAL.html">Ver tarea</a>
            </div>


        </div>

    </div>

    <footer>
        UNIVERSIDAD PRIVADA DE TRUJILLO - UPRIT
        <br>
        Pensamiento, Lenguaje y Cognición Visual
    </footer>

</body>
</html>
